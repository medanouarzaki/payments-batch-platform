version: 2

models:
  - name: fct_transactions
    description: One row per deduplicated transaction, with its EUR-converted amount and the fx resolution status behind it.
    columns:
      - name: transaction_id
        description: Raw transaction identifier, carried over from int_transactions_deduped.
        tests:
          - unique
          - not_null
      - name: event_timestamp_utc
        description: Event timestamp converted to UTC, carried over from int_transactions_deduped.
      - name: event_date_utc
        description: Calendar date of event_timestamp_utc, carried over from int_transactions_deduped.
        tests:
          - not_null
      - name: source_ingestion_date
        description: Partition date of the landed batch this row came from.
      - name: ingested_at
        description: Timestamp at which the batch containing this row was ingested.
      - name: source_batch_id
        description: Identifier of the landed batch file this row came from.
      - name: status
        description: Transaction status as landed.
        tests:
          - accepted_values:
              arguments:
                values: ['ACCEPTED', 'REJECTED', 'PENDING']
      - name: channel
        description: Payment channel as landed.
        tests:
          - accepted_values:
              arguments:
                values: ['ONLINE', 'POS', 'ATM', 'TRANSFER', 'MOBILE']
      - name: rejection_reason
        description: Reason code as landed, populated only for rejected transactions.
      - name: debtor_country
        description: Resolved debtor alpha-2 country code, carried over from int_transactions_deduped.
      - name: creditor_country
        description: Resolved creditor alpha-2 country code, carried over from int_transactions_deduped.
      - name: currency_code
        description: Currency code of the native transaction amount.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_code
      - name: amount
        description: Native transaction amount, copied unmodified from int_transactions_deduped.
        tests:
          - not_null
      - name: native_minor_units
        description: Number of minor units of currency_code as declared in dim_currency, null when the currency is absent from the dimension.
      - name: has_sub_minor_unit_amount
        description: True when amount carries more decimal precision than native_minor_units allows; since amount is stored as decimal(18,2), this can only be true for a currency whose minor_units is below two.
      - name: amount_eur
        description: Amount converted to EUR by dividing by the quoted rate and rounding to the EUR minor_units read from dim_currency, stored at a fixed two-decimal scale; null when no usable rate exists.
      - name: fx_rate_used
        description: Rate applied for the conversion, 1 for EUR rows, the quoted rate for ok and carried_forward, null otherwise.
      - name: fx_rate_date_used
        description: Date the applied rate actually comes from, event_date_utc for EUR rows, null when no usable rate exists.
      - name: fx_rate_age_days
        description: Number of days between event_date_utc and fx_rate_date_used, zero for EUR rows, null when no usable rate exists.
      - name: fx_status
        description: Fx resolution outcome for this row, one of base_currency, ok, carried_forward, unavailable, rate_missing.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['base_currency', 'ok', 'carried_forward', 'unavailable', 'rate_missing']
      - name: row_hash
        description: Row hash carried over from int_transactions_deduped, used upstream for deduplication.
      - name: duplicate_count
        description: Number of candidate rows that shared this transaction_id before deduplication picked a winner.

  - name: agg_transactions_daily
    description: One row per event date, debtor country, and status, aggregating fct_transactions.
    columns:
      - name: event_date_utc
        description: Calendar date of the transactions in this group.
        tests:
          - not_null
      - name: debtor_country
        description: Resolved debtor alpha-2 country code, null when the raw value could not be resolved upstream.
        tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: alpha_2
      - name: status
        description: Transaction status as landed.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACCEPTED', 'REJECTED', 'PENDING']
      - name: transaction_count
        description: Number of fct_transactions rows in this group.
        tests:
          - not_null
      - name: amount_eur_total
        description: Sum of amount_eur across this group; only converted rows contribute, unconverted rows are counted separately.
      - name: converted_transaction_count
        description: Number of rows in this group whose amount_eur is not null.
      - name: unconverted_transaction_count
        description: Number of rows in this group whose amount_eur is null.
      - name: late_transaction_count
        description: Number of rows in this group whose source_ingestion_date is after event_date_utc.
      - name: distinct_currency_count
        description: Number of distinct native currency codes contributing to this group.
      - name: last_source_ingestion_date
        description: Most recent source_ingestion_date among the rows in this group.

  - name: agg_fx_exposure_daily
    description: One row per event date and currency code, aggregating fct_transactions to show fx exposure and conversion outcomes.
    columns:
      - name: event_date_utc
        description: Calendar date of the transactions in this group.
        tests:
          - not_null
      - name: currency_code
        description: Native currency code of the transactions in this group.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_code
      - name: transaction_count
        description: Number of fct_transactions rows in this group.
        tests:
          - not_null
      - name: amount_native_total
        description: Sum of native amount across this group; valid because currency_code is part of the grain, so every summed row shares the same unit.
      - name: amount_eur_total
        description: Sum of amount_eur across this group; only converted rows contribute, unconverted rows are counted separately.
      - name: converted_transaction_count
        description: Number of rows in this group whose amount_eur is not null.
      - name: unconverted_transaction_count
        description: Number of rows in this group whose amount_eur is null.
      - name: fx_rate_used
        description: Rate applied to this group's rows, taken by max because the rate is constant within a date and currency.
      - name: fx_rate_date_used
        description: Date the applied rate actually comes from, taken by max because it is constant within a date and currency.
      - name: fx_rate_age_days
        description: Number of days between event_date_utc and fx_rate_date_used, taken by max because it is constant within a date and currency.
      - name: fx_status
        description: Fx resolution outcome for this group, taken by max because it is constant within a date and currency.
        tests:
          - accepted_values:
              arguments:
                values: ['base_currency', 'ok', 'carried_forward', 'unavailable', 'rate_missing']
      - name: is_carried_forward
        description: True when this group's fx_status is carried_forward.

  - name: data_quality_daily
    description: One row per ingestion date, summarizing received, quarantined, and deduplicated row counts and rejection reasons.
    columns:
      - name: ingestion_date
        description: Partition date of the landed batch this row summarizes.
        tests:
          - unique
          - not_null
      - name: received_row_count
        description: Total number of stg_transactions rows landed for this ingestion date.
        tests:
          - not_null
      - name: valid_row_count
        description: Number of received rows that passed staging validation.
      - name: quarantined_row_count
        description: Number of received rows that failed staging validation and were quarantined.
        tests:
          - not_null
      - name: duplicate_removed_count
        description: Number of valid rows not kept as a deduplication winner, computed by subtraction since an exact duplicate shares its winner's row_hash.
        tests:
          - not_null
      - name: deduplicated_row_count
        description: Number of valid rows that won deduplication and were kept in fct_transactions.
        tests:
          - not_null
      - name: late_row_count
        description: Number of deduplicated rows whose event date precedes this ingestion date.
      - name: rejection_rate
        description: quarantined_row_count divided by received_row_count, null when no rows were received.
      - name: late_rate
        description: late_row_count divided by deduplicated_row_count, null when no rows were deduplicated.
      - name: quarantined_missing_key_count
        description: Number of quarantined rows carrying the MISSING_KEY reason.
      - name: quarantined_missing_currency_count
        description: Number of quarantined rows carrying the MISSING_CURRENCY reason.
      - name: quarantined_unknown_currency_count
        description: Number of quarantined rows carrying the UNKNOWN_CURRENCY reason.
      - name: quarantined_non_positive_amount_count
        description: Number of quarantined rows carrying the NON_POSITIVE_AMOUNT reason.
      - name: quarantined_invalid_amount_count
        description: Number of quarantined rows carrying the INVALID_AMOUNT reason.
      - name: quarantined_invalid_timestamp_count
        description: Number of quarantined rows carrying the INVALID_TIMESTAMP reason.
