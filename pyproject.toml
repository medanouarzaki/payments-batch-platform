[project]
name = "payments"
version = "0.1.0"
description = "Batch pipeline for payment transaction data"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb",
    "dbt-core",
    "dbt-duckdb",
    "pyarrow",
    "requests",
    "python-dotenv",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "responses",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# set below the 95% measured on the payments package to leave headroom
fail_under = 90
